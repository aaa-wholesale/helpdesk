<style>
* { box-sizing:border-box; margin:0; padding:0; }

/* ── Full viewport so button can move anywhere on screen ── */
html, body {
  width: 100vw;
  height: 100vh;
  background: transparent;
  overflow: hidden;
  /* Body itself does NOT capture pointer events — only the FAB does */
  pointer-events: none;
}

#fab, #pulse, #tip, #menu, #opacityPanel {
  pointer-events: all;
}

#fab {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 4px 20px rgba(37,99,235,0.5), 0 2px 8px rgba(0,0,0,0.4),
              inset 0 1px 0 rgba(255,255,255,0.9);
  border: 2px solid rgba(37,99,235,0.4);
  display: flex; align-items: center; justify-content: center;
  cursor: grab;
  outline: none;
  transition: box-shadow .15s, opacity .2s;
  user-select: none;
  touch-action: none;
}
#fab:hover {
  box-shadow: 0 8px 28px rgba(37,99,235,.75), 0 3px 12px rgba(0,0,0,.5);
}
#fab:active { cursor: grabbing; }
#fab.dragging { cursor: grabbing !important; transition: none; }
#fab img {
  width: 44px; height: 44px;
  object-fit: contain; border-radius: 50%;
  pointer-events: none;
}

#pulse {
  position: fixed;
  bottom: 16px; right: 16px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(37,99,235,0.3);
  animation: pulse 2.8s ease-out infinite;
  pointer-events: none;
  transition: opacity .2s;
}
@keyframes pulse {
  0%   { transform:scale(1); opacity:.7; }
  70%  { transform:scale(1.75); opacity:0; }
  100% { transform:scale(1.75); opacity:0; }
}

/* Tooltip */
#tip {
  position: fixed;
  bottom: 86px; right: 4px;
  background: #0F172A;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 5px 10px; border-radius: 7px;
  border: 1px solid rgba(37,99,235,.4);
  white-space: nowrap;
  opacity: 0; transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  pointer-events: none;
  box-shadow: 0 3px 12px rgba(0,0,0,.4);
}

/* Menu popup */
#menu {
  display: none;
  position: fixed;
  bottom: 86px; right: 6px;
  background: #0F172A;
  border: 1px solid rgba(37,99,235,.3);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
  min-width: 190px;
  z-index: 9999;
}
#menu.open { display: block; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  color: #F1F5F9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: background .12s;
  text-decoration: none;
}
.menu-item:hover { background: rgba(37,99,235,.25); }
.menu-sep { height: 1px; background: rgba(148,163,184,.15); margin: 4px 0; }

/* Transparency slider row */
.opacity-row {
  padding: 8px 12px 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.opacity-row label {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px; color: #94a3b8; font-weight: 600;
}
.opacity-row input[type=range] {
  width: 100%;
  accent-color: #2563EB;
  cursor: pointer;
  height: 4px;
}
</style>
</head>

<div id="tip">🛠 IT Helpdesk · drag to move</div>

<div id="menu">
  <a class="menu-item" onclick="openPage('helpdesk_launcher.html')">🚀 Quick Submit Ticket</a>
  <a class="menu-item" onclick="openPage('index.html')">📋 Open Full Helpdesk</a>
  <div class="menu-sep"></div>
  <a class="menu-item" onclick="takeScreenshot()">📸 Screenshot</a>
  <a class="menu-item" onclick="startRecord()">🎬 Record Screen</a>
  <div class="menu-sep"></div>
  <!-- Transparency slider -->
  <div class="opacity-row">
    <label>🔆 Transparency</label>
    <input type="range" id="opSlider" min="20" max="100" value="100"
      oninput="setFabOpacity(this.value/100)">
  </div>
  <div class="menu-sep"></div>
  <a class="menu-item" onclick="closeMenu()" style="color:#94a3b8;font-weight:500">✕ Close menu</a>
</div>

<script>
const BASE = (function(){
  const url = new URL(window.location.href);
  return url.origin + url.pathname.replace(/[^/]*$/, '');
})();

// ── Opacity ──────────────────────────────────────────────
function setFabOpacity(v) {
  const fab = document.getElementById('fab');
  const pls = document.getElementById('pulse');
  fab.style.opacity = v;
  pls.style.opacity = Math.min(v, 0.9);
  try { localStorage.setItem('hd_fab_opacity', v); } catch{}
}
(function initOpacity(){
  const v = parseFloat(localStorage.getItem('hd_fab_opacity') || '1');
  setFabOpacity(v);
  const sl = document.getElementById('opSlider');
  if (sl) sl.value = Math.round(v * 100);
})();

// ── Dragging — works on ALL surfaces ─────────────────────
(function initDrag(){
  const fab = document.getElementById('fab');
  const pls = document.getElementById('pulse');
  let dragging = false, startX, startY, origL, origT;

  function getPos() {
    const r = fab.getBoundingClientRect();
    return { left: r.left, top: r.top };
  }

  function applyPos(l, t) {
    const maxL = window.innerWidth  - 68;
    const maxT = window.innerHeight - 68;
    l = Math.max(0, Math.min(maxL, l));
    t = Math.max(0, Math.min(maxT, t));
    fab.style.right  = 'auto'; fab.style.bottom = 'auto';
    fab.style.left   = l + 'px';
    fab.style.top    = t + 'px';
    pls.style.right  = 'auto'; pls.style.bottom = 'auto';
    pls.style.left   = l + 'px';
    pls.style.top    = t + 'px';
    return { l, t };
  }

  // Restore saved position
  try {
    const p = JSON.parse(localStorage.getItem('hd_fab_pos') || 'null');
    if (p) applyPos(p.l, p.t);
  } catch{}

  fab.addEventListener('pointerdown', e => {
    if (menuOpen) return;
    dragging = false;
    const pos = getPos();
    origL = pos.left; origT = pos.top;
    startX = e.clientX; startY = e.clientY;
    fab.setPointerCapture(e.pointerId);
    fab._pointerStart = { x: e.clientX, y: e.clientY, t: Date.now() };
    e.preventDefault();
  });

  fab.addEventListener('pointermove', e => {
    if (!fab._pointerStart) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      dragging = true;
      fab.classList.add('dragging');
    }
    if (dragging) {
      applyPos(origL + dx, origT + dy);
    }
  });

  fab.addEventListener('pointerup', e => {
    if (dragging) {
      const pos = getPos();
      try { localStorage.setItem('hd_fab_pos', JSON.stringify({ l: pos.left, t: pos.top })); } catch{}
    }
    dragging = false;
    fab.classList.remove('dragging');
    fab._pointerStart = null;
  });
})();

// ── Menu ─────────────────────────────────────────────────
let menuOpen = false;

document.getElementById('fab').addEventListener('mouseenter', () => {
  if (!menuOpen) { document.getElementById('tip').style.opacity = '1'; }
  document.getElementById('tip').style.transform = 'translateY(0)';
});
document.getElementById('fab').addEventListener('mouseleave', () => {
  document.getElementById('tip').style.opacity = '0';
  document.getElementById('tip').style.transform = 'translateY(4px)';
});

document.getElementById('fab').addEventListener('click', (e) => {
  // Only open menu if this was NOT a drag
  if (document.getElementById('fab').classList.contains('dragging')) return;
  const ps = document.getElementById('fab')._pointerStart;
  if (ps) return; // still tracking
  e.stopPropagation();
  menuOpen ? closeMenu() : openMenu();
});

// Separate click logic to distinguish tap vs drag
document.getElementById('fab').addEventListener('pointerup', (e) => {
  const ps = document.getElementById('fab')._pointerStart;
  const dragged = document.getElementById('fab').classList.contains('dragging');
  if (!dragged) {
    e.stopPropagation();
    setTimeout(() => { menuOpen ? closeMenu() : openMenu(); }, 50);
  }
});

document.addEventListener('click', (e) => {
  if (menuOpen && !document.getElementById('menu').contains(e.target)) closeMenu();
});

// Reposition menu relative to FAB
function positionMenu() {
  const fab = document.getElementById('fab');
  const menu = document.getElementById('menu');
  const r = fab.getBoundingClientRect();
  const mh = menu.offsetHeight || 200;
  const mw = menu.offsetWidth  || 190;
  let top  = r.top - mh - 8;
  let left = r.right - mw;
  if (top  < 8)  top  = r.bottom + 8;
  if (left < 8)  left = 8;
  menu.style.top    = top  + 'px';
  menu.style.bottom = 'auto';
  menu.style.left   = left + 'px';
  menu.style.right  = 'auto';
}

function openMenu() {
  menuOpen = true;
  document.getElementById('menu').classList.add('open');
  document.getElementById('tip').style.opacity = '0';
  document.getElementById('pulse').style.animationPlayState = 'paused';
  positionMenu();
}

function closeMenu() {
  menuOpen = false;
  document.getElementById('menu').classList.remove('open');
  document.getElementById('pulse').style.animationPlayState = 'running';
}

function openPage(path) {
  closeMenu();
  window.open(BASE + path, '_blank');
}

// ── Screenshot ───────────────────────────────────────────
async function takeScreenshot() {
  closeMenu();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    await new Promise(r => setTimeout(r, 300));
    const video = document.createElement('video');
    video.srcObject = stream; video.muted = true;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    await new Promise(r => setTimeout(r, 100));
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    stream.getTracks().forEach(t => t.stop());
    const dataUrl = canvas.toDataURL('image/png');
    const payload = {
      files: [{ name: 'screenshot_' + Date.now() + '.png', mimeType: 'image/png', dataUrl, type: 'screenshot' }],
      savedAt: Date.now()
    };
    localStorage.setItem('hd_launcher_attachment', JSON.stringify(payload));
    window.open(BASE + 'helpdesk_launcher.html', '_blank');
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('Screenshot failed: ' + e.message);
  }
}

// ── Screen Recording ─────────────────────────────────────
let mediaRecorder = null, recChunks = [];
async function startRecord() {
  closeMenu();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    recChunks = [];
    const mimeType = ['video/webm;codecs=vp9','video/webm','video/mp4']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        const payload = {
          files: [{ name: 'recording_' + Date.now() + '.webm', mimeType: 'video/webm',
                    dataUrl: ev.target.result, type: 'recording' }],
          savedAt: Date.now()
        };
        try {
          indexedDB.open('hd_launcher',1).onsuccess = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('kv')) return;
            db.transaction('kv','readwrite').objectStore('kv')
              .put(payload,'hd_launcher_attachment_idb');
          };
        } catch(e) {}
        localStorage.setItem('hd_launcher_attachment',
          JSON.stringify({ useIDB: true, savedAt: Date.now() }));
        window.open(BASE + 'helpdesk_launcher.html', '_blank');
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start(1000);
    // Logo is full-color, no filter needed
    document.getElementById('fab').title = 'Click to STOP recording';
    document.getElementById('fab').onclick = (e) => { e.stopPropagation(); stopRecord(); };
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('Recording failed: ' + e.message);
  }
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  // Reset filter (no-op)
  document.getElementById('fab').title = 'AAA IT Helpdesk';
  document.getElementById('fab').onclick = null;
}

// PWA install prompt
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
</script>
