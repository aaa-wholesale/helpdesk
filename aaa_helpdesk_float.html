<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body {
  width:100vw; height:100vh;
  background: transparent;
  overflow: hidden;
  pointer-events: none;
}
#fab, #pulse, #tip, #menu { pointer-events: all; }

#fab {
  position: fixed;
  bottom: 6px; right: 6px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(145deg, #0d2660 0%, #1B4F8A 45%, #2563EB 100%);
  box-shadow: 0 4px 20px rgba(37,99,235,0.6), 0 2px 8px rgba(0,0,0,0.5),
              inset 0 1px 0 rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  cursor: grab; outline: none;
  transition: transform .15s, box-shadow .15s;
  user-select: none;
  touch-action: none;
}
#fab:active { cursor: grabbing; }
#fab:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 28px rgba(37,99,235,.75), 0 3px 12px rgba(0,0,0,.5);
}
#fab:active { transform: scale(.93); }
#fab img {
  width: 44px; height: 44px;
  object-fit: contain; border-radius: 50%;
  pointer-events: none;
  -webkit-app-region: no-drag;
}

#pulse {
  position: fixed;
  bottom: 6px; right: 6px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(37,99,235,0.3);
  animation: pulse 2.8s ease-out infinite;
  pointer-events: none;
}
@keyframes pulse {
  0%   { transform:scale(1); opacity:.7; }
  70%  { transform:scale(1.75); opacity:0; }
  100% { transform:scale(1.75); opacity:0; }
}

/* Tooltip */
#tip {
  position: fixed;
  bottom: 76px; right: 0;
  background: #0F172A;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 5px 10px; border-radius: 7px;
  border: 1px solid rgba(37,99,235,.4);
  white-space: nowrap;
  opacity: 0; transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  pointer-events: none;
  box-shadow: 0 3px 12px rgba(0,0,0,.4);
}

/* Menu popup */
#menu {
  display: none;
  position: fixed;
  bottom: 76px; right: 6px;
  background: #0F172A;
  border: 1px solid rgba(37,99,235,.3);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
  min-width: 180px;
  z-index: 9999;
}
#menu.open { display: block; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: background .12s;
  text-decoration: none;
}
.menu-item:hover { background: rgba(37,99,235,.25); }
.menu-sep { height: 1px; background: rgba(148,163,184,.15); margin: 4px 0; }
</style>
</head>

<div id="tip">🛠 IT Helpdesk</div>

<div id="menu">
  <a class="menu-item" onclick="openPage('helpdesk_launcher.html')">🚀 Quick Submit Ticket</a>
  <a class="menu-item" onclick="openPage('index.html')">📋 Open Full Helpdesk</a>
  <div class="menu-sep"></div>
  <a class="menu-item" onclick="takeScreenshot()">📸 Screenshot</a>
  <a class="menu-item" onclick="startRecord()">🎬 Record Screen</a>
  <div class="menu-sep"></div>
  <div class="menu-sep"></div>
  <div class="menu-item" style="flex-direction:column;align-items:flex-start;gap:4px;cursor:default">
    <span style="font-size:11px;color:#94a3b8;font-weight:600">🔆 Transparency</span>
    <input type="range" min="20" max="100" value="100" id="fabOpSlider" oninit="this.value=Math.round((parseFloat(localStorage.getItem('hd_fab_opacity')||'1'))*100)"
      style="width:100%;accent-color:#2563EB;cursor:pointer"
      oninput="const v=this.value/100;document.getElementById('fab').style.opacity=v;document.getElementById('pulse').style.opacity=v*0.7;try{localStorage.setItem('hd_fab_opacity',v)}catch{}">
  </div>
  <a class="menu-item" onclick="closeMenu()" style="color:var(--text3,#94a3b8);font-weight:500">✕ Close menu</a>
</div>

<script>
const BASE = (function(){
  const url = new URL(window.location.href);
  return url.origin + url.pathname.replace(/[^/]*$/, '');
})();

let menuOpen = false;

document.getElementById('fab').addEventListener('mouseenter', () => {
  if (!menuOpen) document.getElementById('tip').style.opacity = '1';
  document.getElementById('tip').style.transform = 'translateY(0)';
});
document.getElementById('fab').addEventListener('mouseleave', () => {
  document.getElementById('tip').style.opacity = '0';
  document.getElementById('tip').style.transform = 'translateY(4px)';
});

document.getElementById('fab').addEventListener('click', (e) => {
  e.stopPropagation();
  menuOpen ? closeMenu() : openMenu();
});

document.addEventListener('click', () => { if (menuOpen) closeMenu(); });

function openMenu() {
  menuOpen = true;
  document.getElementById('menu').classList.add('open');
  document.getElementById('tip').style.opacity = '0';
  document.getElementById('pulse').style.animationPlayState = 'paused';
}

function closeMenu() {
  menuOpen = false;
  document.getElementById('menu').classList.remove('open');
  document.getElementById('pulse').style.animationPlayState = 'running';
}

function openPage(path) {
  closeMenu();
  window.open(BASE + path, '_blank');
}

async function takeScreenshot() {
  closeMenu();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    await new Promise(r => setTimeout(r, 300));
    const video = document.createElement('video');
    video.srcObject = stream; video.muted = true;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    await new Promise(r => setTimeout(r, 100));
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    stream.getTracks().forEach(t => t.stop());
    const dataUrl = canvas.toDataURL('image/png');
    const payload = {
      files: [{ name: 'screenshot_' + Date.now() + '.png', mimeType: 'image/png', dataUrl, type: 'screenshot' }],
      savedAt: Date.now()
    };
    localStorage.setItem('hd_launcher_attachment', JSON.stringify(payload));
    window.open(BASE + 'helpdesk_launcher.html', '_blank');
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('Screenshot failed: ' + e.message);
  }
}

let mediaRecorder = null, recChunks = [];
async function startRecord() {
  closeMenu();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    recChunks = [];
    const mimeType = ['video/webm;codecs=vp9','video/webm','video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        const payload = {
          files: [{ name: 'recording_' + Date.now() + '.webm', mimeType: 'video/webm', dataUrl: ev.target.result, type: 'recording' }],
          savedAt: Date.now()
        };
        try { indexedDB.open('hd_launcher',1).onsuccess = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('kv')) return;
          db.transaction('kv','readwrite').objectStore('kv').put(payload,'hd_launcher_attachment_idb');
        }; } catch(e) {}
        localStorage.setItem('hd_launcher_attachment', JSON.stringify({ useIDB: true, savedAt: Date.now() }));
        window.open(BASE + 'helpdesk_launcher.html', '_blank');
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start(1000);
    document.getElementById('fabImg').style.filter = 'hue-rotate(130deg) saturate(2)';
    document.getElementById('fab').title = 'Click to STOP recording';
    document.getElementById('fab').onclick = (e) => { e.stopPropagation(); stopRecord(); };
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('Recording failed: ' + e.message);
  }
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  document.getElementById('fabImg').style.filter = '';
  document.getElementById('fab').title = 'AAA IT Helpdesk';
  document.getElementById('fab').onclick = (e) => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
}

// ── Drag to reposition ──
(function(){
  const fab = document.getElementById('fab');
  const pulse = document.getElementById('pulse');
  let dragging = false, ox=0, oy=0;
  function setPos(x,y){
    const s = fab.style;
    s.right = s.bottom = 'auto';
    s.left = Math.max(0,Math.min(window.innerWidth-68,x))+'px';
    s.top  = Math.max(0,Math.min(window.innerHeight-68,y))+'px';
    pulse.style.left = s.left; pulse.style.top = s.top;
  }
  fab.addEventListener('pointerdown', e=>{
    if(menuOpen) return;
    dragging=true; fab.setPointerCapture(e.pointerId);
    const r=fab.getBoundingClientRect();
    ox=e.clientX-r.left; oy=e.clientY-r.top;
    fab.style.cursor='grabbing';
    e.preventDefault();
  });
  fab.addEventListener('pointermove', e=>{
    if(!dragging) return;
    setPos(e.clientX-ox, e.clientY-oy);
  });
  fab.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging=false; fab.style.cursor='grab';
    // Save position
    const r=fab.getBoundingClientRect();
    try{ localStorage.setItem('hd_fab_pos', JSON.stringify({x:r.left,y:r.top})); }catch{}
  });
  // Restore saved position
  try{
    const p=JSON.parse(localStorage.getItem('hd_fab_pos')||'null');
    if(p) setPos(p.x,p.y);
  }catch{}
})();

// ── Transparency control ──
(function(){
  const stored = parseFloat(localStorage.getItem('hd_fab_opacity')||'1');
  document.getElementById('fab').style.opacity = stored;
  document.getElementById('pulse').style.opacity = stored * 0.7;
  // Add opacity item to menu on next render
  window._fabOpacity = stored;
})();

// PWA install prompt
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
</script>
